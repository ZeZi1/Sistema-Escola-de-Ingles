<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema Escolar</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #1e293b; }
        .login-box { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 350px; text-align: center; }
        .login-box h2 { margin-top: 0; color: #1e293b; margin-bottom: 1.5rem; }
        .flash-error { color: #ef4444; background: #fee2e2; padding: 10px; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🏫 Portal Escolar</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-error">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group" style="text-align: left;">
                <label>Usuário</label>
                <input type="text" name="username" required placeholder="Digite seu usuário">
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Senha</label>
                <div class="password-container">
                    <input type="password" name="password" id="pass" required placeholder="••••••••">
                    <button type="button" class="btn-eye" onclick="togglePassword()">
                        <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Entrar no Sistema</button>
        </form>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('pass');
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
